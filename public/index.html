<style>

  color-scheme:light dark;

@media (prefers-color-scheme:dark){:root{
  --bg:#161a1f; --surface:#1e242a; --line:#2e363d; --fg:#e7e9e4; --muted:#8e9892;
  --glow:#e6b65a; --glow-soft:#3d3423; --dot:#343c43}}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;

.wrap{max-width:720px;margin:0 auto;padding:0 16px;padding-block:28px 32px;display:flex;flex-direction:column;gap:28px;min-height:100vh;min-height:100svh}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
header .row{flex-wrap:nowrap;flex-shrink:0}
h1{font:700 1.6rem/1.1 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.88rem;margin-top:4px}
.btn{font:500 .88rem var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}

/* friends as floating bubbles: warmer (recently thought-of) friends sit higher and a little larger */

.grid{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:14px 12px;padding-top:4px}
.bub{position:relative;width:calc(var(--s) + 14px);padding:var(--dy,0) 0 0;background:none;border:0;color:var(--fg);font:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.bub .orb{position:relative;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 34% 28%,hsl(var(--h) var(--osat) var(--o1)) 0,hsl(var(--h) var(--osat) var(--o2)) 55%,hsl(var(--h) calc(var(--osat) - 15%) var(--o3)) 100%);
  border:1.5px solid hsl(var(--h) 50% var(--oedge) / .85);
  box-shadow:0 10px 22px -12px hsl(var(--h) 40% 30% / .45),inset 0 -8px 18px hsl(var(--h) 60% 60% / .18);
  animation:bob 7s ease-in-out var(--bd,0s) infinite alternate;transition:transform .15s ease}
.bub:active .orb{transform:scale(.94)}
.bub .orb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.bub .orb::after{content:"";position:absolute;left:18%;top:14%;width:30%;height:15%;border-radius:50%;background:rgba(255,255,255,.62);transform:rotate(-35deg);pointer-events:none}
.bub .initial{font:700 calc(var(--s) * .4)/1 var(--display);color:hsl(var(--h) 45% var(--oink))}
.bub .name{font:700 1.02rem/1.15 var(--display);text-align:center;overflow-wrap:anywhere;max-width:100%}
.bub .meta{font-size:.72rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;margin-top:-4px}
.bub .key{position:absolute;top:calc(var(--dy,0px) + 2px);right:2px;font-size:.68rem;color:var(--muted);opacity:0}
@media (hover:hover){.bub .key{opacity:.6}}
.bub .ripple{position:absolute;inset:-2px;border-radius:50%;border:2px solid hsl(var(--h) 70% 65%);opacity:0;pointer-events:none}
.bub.lit .ripple{animation:ripple .9s ease-out}
@keyframes ripple{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.45)}}
@keyframes bob{from{translate:0 -3px}to{translate:0 3px}}
.rise{position:fixed;z-index:40;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fff 0,hsl(var(--h) 80% 80% / .5) 60%,hsl(var(--h) 80% 70% / .8) 100%);border:1px solid hsl(var(--h) 70% 70%);
  animation:rise 1.4s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--rx,10px),-160px) scale(1.1)}}

.bub.add .orb::after{display:none}

.row{display:flex;gap:8px;flex-wrap:wrap}

.foot{color:var(--muted);font-size:.78rem;display:flex;flex-direction:column;gap:8px;max-width:52ch;margin-top:auto;padding-top:48px;opacity:.85}

.acct{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

.acct .link{text-align:left}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;

  width:max-content;max-width:calc(100% - 32px);transition:.2s ease;font-size:.92rem}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--glow);font:600 .9rem var(--body);cursor:pointer;padding:4px 2px}

.show .bottom{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}

.track{position:relative;height:22px}

.finale{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:1;text-align:center;pointer-events:none;
  font:700 clamp(1.5rem,5vw,2.4rem)/1.25 var(--display);text-wrap:balance;opacity:0;transition:opacity 1.6s ease;text-shadow:0 2px 24px rgba(20,20,50,.6)}

  font:600 .8rem var(--body);color:#fff;background:rgba(180,40,50,.85);border:0;border-radius:999px;padding:7px 14px;cursor:pointer}

.ctrls{flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){.finale,.show .top,.show .bottom{transition:none}}

<script>
(() => {
  const $ = s => document.querySelector(s);
  const DAY = 864e5;
  const KEY = "toy.data.v1";                    // on-device data (signed-out mode)
  const SYNC = "toy.sync.v1";                   // signed-in: last server view + unsent ops
  const SUPABASE_URL = "https://kypddcfsmexknrcqxdsx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_qbS_LEB-c92G9cv76mmn4w_ZQ92zIde";
  const status = t => { $("#status").textContent = t; };
  const lsGet = (k,d) => { try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } };
  const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch{ return false; } };
  const empty = () => ({friends:{}, moments:{}});
  const HUES = [200, 330, 42, 160, 270, 12, 95, 235, 300, 180];
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

  // `state` is always what the UI shows. Signed out it IS the on-device data;
  // signed in it is the server view (`base`) with unsent ops (`queue`) replayed on top.
  let mode = "local", user = null, sb = null;
  // The site moved from thinking-of-you-onyy.netlify.app to the jall.me domain. Browsers keep
  // separate storage per address, so the old address hands its on-device data over in the URL.
  const HOME = "thinking-of-you.jall.me";
  if(/\.netlify\.app$/.test(location.hostname)){
    let hash = "";
    try{
      const raw = localStorage.getItem(KEY);
      if(raw && raw.length > 30) hash = "#carry=" + encodeURIComponent(btoa(unescape(encodeURIComponent(raw))));
    }catch{}
    location.replace("https://" + HOME + "/" + location.search + hash);
    return;
  }
  let local = lsGet(KEY, empty()); local = {friends:local.friends||{}, moments:local.moments||{}};
  if(location.hash.startsWith("#carry=")){
    try{
      const d = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(7))))));
      local = {friends:{...(d.friends||{}), ...local.friends}, moments:{...(d.moments||{}), ...local.moments}};
      lsSet(KEY, local);
      // let the next sign-in carry these into the account too
      Object.keys(localStorage).filter(k => k.startsWith("toy.merged.")).forEach(k => localStorage.removeItem(k));
    }catch{}
    history.replaceState(null, "", location.pathname + location.search);
  }
  let base = empty(), queue = [];
  let state = local;

  function applyOp(s, op){
    const [col,id] = op.path.split("/"), bucket = s[col]; if(!bucket) return;
    if(op.t==="set") bucket[id] = {...op.data};
    else if(op.t==="update"){ if(bucket[id]) bucket[id] = {...bucket[id], ...op.data}; }
    else if(op.t==="delete") delete bucket[id];
  }
  function recompute(){
    if(mode!=="sync") return;
    state = {friends:{...base.friends}, moments:{...base.moments}};
    queue.forEach(op => applyOp(state, op));
  }
  const saveSync = () => lsSet(SYNC, {userId:user?.id, base, queue});
  const view = () => state;

  function write(op){
    if(mode==="sync"){ queue.push(op); recompute(); saveSync(); render(); flush(); return; }
    applyOp(local, op);

  // ---- sync (Supabase) ----
  const COLS = {friends:{name:"name", order:"ord", photo:"photo", lastAt:"last_at", createdAt:"created_at", aliases:"aliases"},
                moments:{friendId:"friend_id", at:"at", note:"note"}};
  const toRow = (col, data) => { const r = {}; for(const [k,v] of Object.entries(data)) if(COLS[col][k]) r[COLS[col][k]] = v ?? null; return r; };
  const fromRow = (col, row) => { const d = {}; for(const [k,c] of Object.entries(COLS[col])) if(row[c] != null) d[k] = row[c]; return d; };

    if(mode!=="sync" || flushing || !navigator.onLine) return; flushing = true;
    try{
      while(queue.length){
        const op = queue[0], [col,id] = op.path.split("/"), t = sb.from(col);

          : op.t==="update" ? await t.update(toRow(col, op.data)).eq("id", id)
          : await t.delete().eq("id", id);

    if(mode!=="sync") return;

        sb.from("moments").select("*").gte("at", since).order("at", {ascending:false}).limit(20000),
      ]);
      if(f.error || m.error) return false;
      base = {friends:Object.fromEntries(f.data.map(r=>[r.id, fromRow("friends", r)])),
              moments:Object.fromEntries(m.data.map(r=>[r.id, fromRow("moments", r)]))};
      recompute(); saveSync(); render();
      return true;
    })();
    try{ return await pulling; } finally { pulling = null; }
  }
  let pullTimer;
  const pullSoon = () => { clearTimeout(pullTimer); pullTimer = setTimeout(() => { if(!queue.length) pull(); else flush().then(pull); }, 400); };

  async function enterSync(u){
    user = u; mode = "sync";
    const cached = lsGet(SYNC, null);
    if(cached && cached.userId===u.id){ base = cached.base||empty(); queue = cached.queue||[]; }
    else { base = empty(); queue = []; }
    // first sign-in on this device: carry any on-device friends and moments into the account
    if((Object.keys(local.friends).length || Object.keys(local.moments).length) && !lsGet("toy.merged."+u.id, false)){
      for(const [id,f] of Object.entries(local.friends)) queue.push({t:"set", path:"friends/"+id, data:f});
      for(const [id,m] of Object.entries(local.moments)) queue.push({t:"set", path:"moments/"+id, data:m});
      lsSet("toy.merged."+u.id, true);
    }
    recompute(); saveSync(); renderAccount(); render();
    if(subscribedTo!==u.id){
      sb.removeAllChannels(); subscribedTo = u.id;
      sb.channel("toy-"+u.id)
        .on("postgres_changes", {event:"*", schema:"public", table:"friends"}, pullSoon)
        .on("postgres_changes", {event:"*", schema:"public", table:"moments"}, pullSoon)
        .subscribe();
    }
    await flush(); await pull();
  }
  let subscribedTo = null;
  function leaveSync(){
    subscribedTo = null; mode = "local"; user = null; base = empty(); queue = []; state = local;
    try{ localStorage.removeItem(SYNC); }catch{}
    sb?.removeAllChannels(); renderAccount(); render();
  }
  addEventListener("online", () => { flush(); pullSoon(); });
  document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible") pullSoon(); });
  setInterval(() => queue.length && flush(), 20000);
  // safety net if the realtime socket drops: refresh every minute while the page is visible
  setInterval(() => { if(mode==="sync" && document.visibilityState==="visible") pullSoon(); }, 60000);

  // ---- actions ----
  function logThought(fid){
    const f = state.friends[fid]; if(!f) return;
    const at = Date.now(), mid = uid(), prevLast = f.lastAt || null;
    orderHoldUntil = at + 1300; setTimeout(render, 1350);   // let it float up after a beat
    write({t:"set", path:"moments/"+mid, data:{friendId:fid, at}});
    write({t:"update", path:"friends/"+fid, data:{lastAt:at}});
    const bub = document.querySelector(`#grid .bub[data-id="${CSS.escape(fid)}"]`);
    if(bub){
      bub.classList.remove("lit"); void bub.offsetWidth; bub.classList.add("lit");
      const r = bub.querySelector(".orb").getBoundingClientRect();
      const up = document.createElement("span"); up.className = "rise";
      up.style.cssText = `left:${r.left + r.width/2}px;top:${r.top + r.height*.3}px;--h:${bub.style.getPropertyValue("--h")};--rx:${Math.round((Math.random()-.5)*40)}px`;
      document.body.append(up); setTimeout(() => up.remove(), 1500);
    }
    if(navigator.vibrate) try{navigator.vibrate(12)}catch{}
    showToast(f.name, mid, fid, prevLast);
  }

  let toastTimer;
  function showToast(name, mid, fid, prevLast){
    const t = $("#toast"); clearTimeout(toastTimer);
    t.innerHTML = "";
    const msg = document.createElement("span"); msg.textContent = "Thought of " + name;
    const note = document.createElement("button"); note.textContent = "Add note";
    const undo = document.createElement("button"); undo.textContent = "Undo";
    t.append(msg, note, undo); t.classList.add("on");
    const hide = () => t.classList.remove("on");
    toastTimer = setTimeout(hide, 5000);
    undo.onclick = () => {
      write({t:"delete", path:"moments/"+mid});
      write({t:"update", path:"friends/"+fid, data:{lastAt:prevLast}});
      hide();
    };
    note.onclick = () => {
      clearTimeout(toastTimer);
      t.innerHTML = "";
      const inp = document.createElement("input"); inp.placeholder = "What came up? (Enter to save)";
      const sv = document.createElement("button"); sv.textContent = "Save";
      t.append(inp, sv); inp.focus();
      const done = () => {
        const v = inp.value.trim(), m = state.moments[mid];
        if(v && m) write({t:"set", path:"moments/"+mid, data:{...m, note:v}});
        hide();
      };
      sv.onclick = done;
      inp.onkeydown = e => { if(e.key==="Enter") done(); if(e.key==="Escape") hide(); };
    };
  }

  function addFriend(name){
    name = name.trim(); if(!name) return;
    const order = Object.values(state.friends).reduce((m,f)=>Math.max(m, f.order||0), 0) + 1;
    write({t:"set", path:"friends/"+uid(), data:{name, order, createdAt:Date.now()}});
  }

  // photos: center-cropped, downscaled to a small JPEG so localStorage stays light (~10KB each)
  let photoFor = null;
  function pickPhoto(fid){ photoFor = fid; $("#photoFile").click(); }
  $("#photoFile").onchange = async e => {
    const file = e.target.files[0]; e.target.value = ""; const fid = photoFor; photoFor = null;
    if(!file || !fid) return;
    try{
      const bmp = await createImageBitmap(file);
      const S = 192, side = Math.min(bmp.width, bmp.height);
      const c = document.createElement("canvas"); c.width = c.height = S;
      c.getContext("2d").drawImage(bmp, (bmp.width-side)/2, (bmp.height-side)/2, side, side, 0, 0, S, S);
      write({t:"update", path:"friends/"+fid, data:{photo:c.toDataURL("image/jpeg", 0.8)}});
      if(sheet.open) openFriendSheet(fid);
    }catch{ status("Couldn't read that photo. Try a JPEG or PNG."); }
  };

  // quick log from a link, e.g. a Siri Shortcut opening ?thought=sofs wondering how her exam went
  // (also ?friend=sophie&note=...). Names are matched by sound as well as spelling (see match.js).
  function quickLog(){
    const q = new URLSearchParams(location.search);
    const text = q.get("thought"), friendParam = q.get("friend"), noteParam = (q.get("note") || "").trim();
    if(text == null && friendParam == null) return;
    history.replaceState(null, "", location.pathname);
    const fs = Object.entries(state.friends).map(([id,f])=>({id,...f}));
    const r = window.matchThought ? window.matchThought(friendParam ?? text, fs) : {best:null, candidates:[], guess:""};
    const log = (id, note) => { logThought(id); if(note) addNoteTo(id, note); };
    if(r.best) return log(r.best.id, noteParam || r.best.note);

    openWhoSheet((text ?? friendParam).trim(), r, noteParam);
  }

  // Siri wasn't sure who: pick anyone (closest first) or add someone new, fix the note, and
  // optionally remember what was heard as a nickname so it matches next time.
  function openWhoSheet(heardText, r, noteParam){
    const friends = Object.entries(state.friends).map(([id,f])=>({id,...f}));
    const hue = hueMap(friends);
    const info = Object.fromEntries((r.ranked || []).map(c => [c.id, c]));
    const order = [...(r.ranked || []).map(c => c.id), ...friends.map(f=>f.id).filter(id => !info[id])];
    const firstWord = heardText.split(/\s+/)[0] || "";
    const guessName = firstWord.replace(/[,.:;!?]+$/, "").replace(/^\w/, c => c.toUpperCase());
    let pick = r.candidates?.[0]?.id || null, noteTouched = !!noteParam;
    const noteFor = id => noteParam || (id === "new" ? heardText.split(/\s+/).slice(1).join(" ") : info[id]?.note ?? heardText);

    openSheet(form => {
      const head = el_("div", {tabIndex:-1, autofocus:true, style:"outline:none"}, el_("strong", {textContent:"Who was it?", style:"font:700 1.2rem var(--display)"}),
        el_("p", {className:"hint", textContent:`Heard: “${heardText}”`}));
      const picks = el_("div", {className:"picks"});
      const newName = el_("input", {value:guessName, placeholder:"Name", ariaLabel:"New person's name", hidden:true});
      const note = el_("textarea", {placeholder:"What came up?", ariaLabel:"Note"});
      note.oninput = () => { noteTouched = true; };
      const remember = el_("input", {type:"checkbox", checked:true});
      const rememberRow = el_("label", {className:"hint check"}, remember, el_("span"));
      const save = el_("button", {type:"submit", className:"btn primary", textContent:"Save"});

      const select = id => {
        pick = id;
        picks.querySelectorAll(".pick").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === id));
        newName.hidden = id !== "new";
        if(!noteTouched) note.value = id ? noteFor(id) : heardText;
        const heard = id && id !== "new" ? (info[id]?.heard || firstWord) : "";
        const f = state.friends[id];
        const already = f && (f.name.toLowerCase() === heard.toLowerCase() || (f.aliases||"").toLowerCase().split(/\s*,\s*/).includes(heard.toLowerCase()));
        rememberRow.hidden = !heard || already;
        rememberRow.lastChild.textContent = f ? `Remember “${heard}” as a nickname for ${f.name}` : "";
        rememberRow.dataset.heard = heard;
        save.disabled = !id;
        if(id === "new") newName.focus();
      };
      const chip = (id, label, h) => {
        const b = el_("button", {type:"button", className:"pick"}); b.dataset.id = id;
        if(h != null) b.style.setProperty("--h", h);
        b.append(el_("span", {className:"dot", textContent: id === "new" ? "+" : ([...label][0] || "?").toUpperCase()}), el_("span", {textContent:label}));
        b.onclick = () => select(id); return b;
      };
      order.forEach(id => { const f = state.friends[id]; if(f) picks.append(chip(id, f.name, hue[id])); });
      picks.append(chip("new", "New", null));

      save.onclick = e => {
        if(!pick){ e.preventDefault(); return; }
        let id = pick;
        if(id === "new"){
          const name = newName.value.trim(); if(!name){ e.preventDefault(); newName.focus(); return; }
          addFriend(name); id = Object.entries(state.friends).find(([,x]) => x.name === name)?.[0];
          if(!id) return;
        } else if(!rememberRow.hidden && remember.checked && rememberRow.dataset.heard){
          const f = state.friends[id], list = (f.aliases ? f.aliases.split(/\s*,\s*/) : []).concat(rememberRow.dataset.heard);
          write({t:"update", path:"friends/"+id, data:{aliases:list.join(", ")}});
        }
        logThought(id);
        const v = note.value.trim(); if(v) addNoteTo(id, v);
      };
      const cancel = el_("button", {type:"button", className:"link", textContent:"Cancel", onclick:() => sheet.close()});
      form.append(head, picks, newName, note, rememberRow, el_("div", {className:"actions"}, cancel, save));
      select(pick);
    });
  }
  function addNoteTo(fid, note){
    const last = Object.entries(state.moments).filter(([,m])=>m.friendId===fid).sort((a,b)=>b[1].at-a[1].at)[0];
    if(last) write({t:"set", path:"moments/"+last[0], data:{...last[1], note}});
  }

  // ---- render ----
  const ago = ms => {
    if(!ms) return "not yet";
    const m = Math.round((Date.now()-ms)/6e4);
    if(m < 1) return "just now"; if(m < 60) return m+"m ago";
    const h = Math.round(m/60); if(h < 24) return h+"h ago";
    const dd = Math.round(h/24); if(dd < 30) return dd+"d ago";
    return new Date(ms).toLocaleDateString(undefined,{day:"numeric",month:"short"});
  };
  const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };

  // ---- friends as bubbles ----
  // Warmth: each moment counts 1 when fresh and halves every ~2 days, so whoever's been on your mind lately floats up.
  const HALF = 2*DAY;
  const warmthOf = (fid, moments, now) => moments.reduce((w,m) => m.friendId===fid && now-m.at < 60*DAY ? w + Math.pow(.5, (now-m.at)/HALF) : w, 0);
  // stable per-friend colour (same one Look back uses) and a bit of organic jitter
  const hueMap = friends => Object.fromEntries([...friends].sort((a,b)=>(a.order||0)-(b.order||0)).map((f,i)=>[f.id, HUES[i%HUES.length]]));
  const hash01 = s => { let h = 2166136261; for(const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h,16777619); } return ((h>>>0)%1000)/1000; };

  let orderHoldUntil = 0, lastOrder = [];
  function render(){
    const s = view(), now = Date.now();
    const friends = Object.entries(s.friends).map(([id,f])=>({id,...f}));
    const moments = Object.entries(s.moments).map(([id,m])=>({id,...m})).sort((a,b)=>b.at-a.at);
    const today = startOfDay(now);
    const hue = hueMap(friends);
    const warm = Object.fromEntries(friends.map(f => [f.id, warmthOf(f.id, moments, now)]));
    const maxW = Math.max(1, ...Object.values(warm));
    const ranked = [...friends].sort((a,b) => warm[b.id]-warm[a.id] || (b.lastAt||0)-(a.lastAt||0) || (a.order||0)-(b.order||0)).map(f=>f.id);
    // right after a tap, hold the order still for a beat so the bubble doesn't jump out from under your finger
    let order = ranked;
    if(now < orderHoldUntil && lastOrder.length) order = [...lastOrder.filter(id => s.friends[id]), ...ranked.filter(id => !lastOrder.includes(id))];
    lastOrder = order;

    const grid = $("#grid");
    const before = {}; grid.querySelectorAll(".bub[data-id]").forEach(el => before[el.dataset.id] = el.getBoundingClientRect());
    const addVal = $("#addInput")?.value || "", addFocused = document.activeElement?.id === "addInput";
    grid.innerHTML = "";

    const todayCount = moments.filter(m=>m.at>=today).length;
    $("#sub").textContent = todayCount ? `${todayCount} moment${todayCount>1?"s":""} of appreciation today.`
      : friends.length ? "Tap someone when they cross your mind. Hold to edit." : "Add the people you want to think of.";

    const small = innerWidth < 380;
    order.forEach((id,i) => {
      const f = s.friends[id]; if(!f) return;
      const week = moments.filter(m=>m.friendId===id && m.at >= today-6*DAY).length;
      const size = Math.round((small ? 72 : 80) + (small ? 62 : 74) * Math.pow(warm[id]/maxW, .7));
      const el = document.createElement("button"); el.type = "button"; el.className = "bub"; el.dataset.id = id;
      el.style.cssText = `--h:${hue[id]};--s:${size}px;--dy:${Math.round(hash01(id)*14)}px;--bd:${(-hash01(id+"b")*7).toFixed(2)}s`;
      el.innerHTML = `<span class="orb">${f.photo?`<img alt="" draggable="false">`:`<span class="initial"></span>`}<span class="ripple"></span></span>
        <span class="name"></span><span class="meta"></span>${i<9?`<span class="key">${i+1}</span>`:""}`;
      if(f.photo) el.querySelector("img").src = f.photo; else el.querySelector(".initial").textContent = [...f.name.trim()][0]?.toUpperCase() || "?";
      el.querySelector(".name").textContent = f.name;
      el.querySelector(".meta").textContent = week ? `${week} this week · ${ago(f.lastAt)}` : ago(f.lastAt);
      el.setAttribute("aria-label", `Thinking of ${f.name}. Hold to edit.`);
      holdable(el, () => logThought(id), () => openFriendSheet(id));
      grid.append(el);
    });

    const add = document.createElement("div"); add.className = "bub add"; add.style.cssText = "--h:40;--s:" + (small ? 76 : 84) + "px";
    const orb = document.createElement("span"); orb.className = "orb";
    const inp = document.createElement("input"); inp.id = "addInput"; inp.placeholder = "+ Add"; inp.setAttribute("aria-label","Add a friend"); inp.value = addVal;
    inp.onkeydown = e => { if(e.key==="Enter"){ const v=inp.value; inp.value=""; addFriend(v); setTimeout(()=>$("#addInput")?.focus(),0);} };
    inp.onblur = () => { const v=inp.value; if(v.trim()){ inp.value=""; addFriend(v); } };
    orb.append(inp); add.append(orb);
    if(!friends.length){ const hint = document.createElement("span"); hint.className="meta"; hint.style.marginTop = "0"; hint.textContent="Type a name, then Enter"; add.append(hint); }
    grid.append(add);
    if(addFocused) inp.focus();

    // FLIP: glide bubbles from where they were to where they are now
    if(!reducedMotion) grid.querySelectorAll(".bub[data-id]").forEach(el => {
      const a = before[el.dataset.id]; if(!a) return;
      const b = el.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
      if(Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      el.style.transition = "none"; el.style.transform = `translate(${dx}px,${dy}px)`;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        el.style.transition = "transform .9s cubic-bezier(.22,.8,.25,1)"; el.style.transform = "";
      }));
    });

    const log = $("#log"); log.innerHTML = "";
    const names = Object.fromEntries(friends.map(f=>[f.id,f.name]));
    const recent = moments.slice(0,40);
    $("#logSec").hidden = !recent.length;
    let lastDay = null;
    recent.forEach(m => {
      const d = startOfDay(m.at);
      if(d!==lastDay){
        lastDay = d;
        const li = document.createElement("li"); li.className="day";
        li.textContent = d===today ? "Today" : d===today-DAY ? "Yesterday" : new Date(d).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"});
        log.append(li);
      }
      const li = document.createElement("li"); li.className="entry"; li.tabIndex = 0;
      const tm = document.createElement("time"); tm.textContent = new Date(m.at).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
      const who = document.createElement("span"); who.className="who"; who.textContent = names[m.friendId] || "Removed friend";
      const note = document.createElement("span"); note.className="note"; note.textContent = m.note || "";
      li.append(tm, who, note);
      li.onclick = () => openMomentSheet(m.id);
      li.onkeydown = e => { if(e.key==="Enter") openMomentSheet(m.id); };
      li.oncontextmenu = e => { e.preventDefault(); openMomentSheet(m.id); };
      log.append(li);
    });
  }
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // tap = onTap; long-press (touch) or right-click (mouse) = onHold
  function holdable(el, onTap, onHold){
    let timer = null, heldAt = 0, sx = 0, sy = 0;
    const cancel = () => { clearTimeout(timer); timer = null; };
    const hold = () => { cancel(); heldAt = Date.now(); if(navigator.vibrate) try{navigator.vibrate(18)}catch{} onHold(); };
    el.addEventListener("pointerdown", e => { if(e.button) return; sx = e.clientX; sy = e.clientY; cancel(); timer = setTimeout(hold, 480); });
    el.addEventListener("pointermove", e => { if(timer && Math.hypot(e.clientX-sx, e.clientY-sy) > 10) cancel(); });
    ["pointerup","pointercancel","pointerleave"].forEach(t => el.addEventListener(t, cancel));
    el.addEventListener("contextmenu", e => { e.preventDefault(); if(Date.now()-heldAt > 700) hold(); });
    el.addEventListener("click", e => { if(Date.now()-heldAt < 700){ e.preventDefault(); return; } onTap(e); });
  }

  // ---- hold-to-edit sheet ----
  const sheet = $("#sheet"), sheetForm = $("#sheetForm");
  // tap the backdrop to close; ignore the click that lands there when the long-press finger lifts
  let sheetOpenedAt = 0, downOnBackdrop = false;
  sheet.addEventListener("pointerdown", e => { downOnBackdrop = e.target === sheet; });
  sheet.addEventListener("click", e => { if(e.target === sheet && downOnBackdrop && Date.now() - sheetOpenedAt > 400) sheet.close(); });
  function openSheet(build){
    sheetForm.innerHTML = ""; build(sheetForm); sheetOpenedAt = Date.now(); downOnBackdrop = false;
    if(!sheet.open){ try{ sheet.showModal(); }catch{ sheet.setAttribute("open",""); } }
  }
  const el_ = (tag, props={}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
  function armed(btn, label, armedLabel, fn){
    btn.textContent = label;
    btn.onclick = e => { e.preventDefault(); if(btn.dataset.armed){ fn(); return; } btn.dataset.armed = 1; btn.textContent = armedLabel;
      setTimeout(() => { delete btn.dataset.armed; btn.textContent = label; }, 3000); };
    return btn;
  }

  function openFriendSheet(fid){
    const f = state.friends[fid]; if(!f) return;
    const hue = hueMap(Object.entries(state.friends).map(([id,x])=>({id,...x})))[fid];
    openSheet(form => {
      const pic = el_("button", {type:"button", className:"orbbtn" + (f.photo ? " has" : "")});
      if(f.photo) pic.style.backgroundImage = `url("${f.photo}")`; else { pic.textContent = "Add photo"; pic.style.borderColor = `hsl(${hue} 50% 60%)`; }
      pic.onclick = () => pickPhoto(fid);
      const name = el_("input", {className:"title", value:f.name, ariaLabel:"Name", autocomplete:"off"});
      const saveName = () => { const v = name.value.trim(); if(v && v !== state.friends[fid]?.name) write({t:"update", path:"friends/"+fid, data:{name:v}}); };
      name.onchange = saveName; name.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); saveName(); sheet.close(); } };
      const top = el_("div", {className:"top"}, pic, name);
      const links = el_("div", {className:"row"});
      links.append(el_("button", {type:"button", className:"link", textContent: f.photo ? "Change photo" : "Choose photo", onclick:()=>pickPhoto(fid)}));
      if(f.photo) links.append(el_("button", {type:"button", className:"link", textContent:"Remove photo",
        onclick:()=>{ write({t:"update", path:"friends/"+fid, data:{photo:null}}); openFriendSheet(fid); }}));
      const nick = el_("input", {value:f.aliases || "", placeholder:"Nicknames, for Siri: Soph, Sofs", ariaLabel:"Nicknames", autocomplete:"off"});
      const saveNick = () => { const v = nick.value.split(",").map(x=>x.trim()).filter(Boolean).join(", "); if(v !== (state.friends[fid]?.aliases || "")) write({t:"update", path:"friends/"+fid, data:{aliases:v || null}}); };
      nick.onchange = saveNick;
      const count = Object.values(state.moments).filter(m=>m.friendId===fid).length;
      const hint = el_("p", {className:"hint", textContent: count ? `${count} moment${count>1?"s":""} so far.` : "No moments yet."});
      const rm = armed(el_("button", {type:"button", className:"link danger"}), `Remove ${f.name}`, "Tap again to remove",
        () => { write({t:"delete", path:"friends/"+fid}); sheet.close(); });
      const done = el_("button", {type:"submit", className:"btn primary", textContent:"Done", onclick:() => { saveName(); saveNick(); }});
      form.append(top, links, nick, hint, el_("div", {className:"actions"}, rm, done));
    });
  }

  function openMomentSheet(mid){
    const m = state.moments[mid]; if(!m) return;
    const who = state.friends[m.friendId]?.name || "Removed friend";
    const when = new Date(m.at).toLocaleString(undefined, {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
    openSheet(form => {
      const title = el_("div", {}, el_("strong", {textContent:who, style:"font:700 1.2rem var(--display)"}), el_("p", {className:"hint", textContent:when}));
      const note = el_("textarea", {value:m.note || "", placeholder:"What came up?", ariaLabel:"Note"});
      const save = () => { const v = note.value.trim(), cur = state.moments[mid]; if(cur && v !== (cur.note||"")) write({t:"set", path:"moments/"+mid, data:{...cur, note:v || null}}); };
      const del = armed(el_("button", {type:"button", className:"link danger"}), "Delete this moment", "Tap again to delete",
        () => { write({t:"delete", path:"moments/"+mid}); sheet.close(); });
      form.append(title, note, el_("div", {className:"actions"}, del, el_("button", {type:"submit", className:"btn primary", textContent:"Save", onclick:save})));
    });
  }

  // keyboard: 1–9 logs that bubble, in the order shown
  addEventListener("keydown", e => {
    if(e.metaKey || e.ctrlKey || e.altKey || !$("#show").hidden || sheet.open) return;
    if(/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) return;
    const n = parseInt(e.key,10); if(!(n>=1 && n<=9)) return;
    [...document.querySelectorAll("#grid .bub[data-id]")][n-1]?.click();
  });

  // ---- backup / restore ----
  $("#exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify({app:"thinking-of-you", v:1, exportedAt:Date.now(), ...state}, null, 2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "thinking-of-you-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    status("Backup downloaded.");
  };
  $("#importBtn").onclick = () => $("#importFile").click();
  $("#importFile").onchange = async e => {
    const file = e.target.files[0]; e.target.value = ""; if(!file) return;
    try{
      const d = JSON.parse(await file.text());
      if(!d || typeof d.friends!=="object" || typeof d.moments!=="object") throw 0;
      if(mode==="sync"){
        if(!confirm("Add everything in this backup to your synced account?")) return;
        for(const [id,f] of Object.entries(d.friends)) queue.push({t:"set", path:"friends/"+id, data:f});
        for(const [id,m] of Object.entries(d.moments)) queue.push({t:"set", path:"moments/"+id, data:m});
        recompute(); saveSync(); render(); flush(); status("Backup added to your account.");
        return;
      }
      if(!confirm("Replace what's on this device with the backup?")) return;
      local = {friends:d.friends, moments:d.moments}; state = local; lsSet(KEY, local); render(); status("Backup restored.");
    }catch{ status("That doesn't look like a Thinking of You backup."); }
  };

  // ---- account: optional email sign-in for sync ----
  const PRIVACY_LOCAL = "Everything stays on this device. Nothing is sent anywhere, and there's no account. For an app-like icon that keeps your data safe, add this page to your home screen.";
  const PRIVACY_SYNC = "Synced to your account, so your phone and laptop share one list. Only you can see it.";
  let signInStep = null, signInEmail = "";
  function renderAccount(){
    const box = $("#account"); box.innerHTML = "";
    $("#privacy").textContent = mode==="sync" ? PRIVACY_SYNC : PRIVACY_LOCAL;
    if(!sb) return;
    const link = (text, fn, cls) => { const b = document.createElement("button"); b.className = "link" + (cls ? " "+cls : ""); b.type = "button"; b.textContent = text; b.onclick = fn; return b; };
    if(mode==="sync"){
      const row = document.createElement("div"); row.className = "row";
      const who = document.createElement("span"); who.textContent = "Signed in as " + (user.email || "you");
      row.append(who,
        link("Sign in another device", makePairLink),
        link("Sign out", async () => { await sb.auth.signOut().catch(()=>{}); leaveSync(); status("Signed out. Showing what's saved on this device."); }));
      box.append(row);
      if(pairUrl){
        const form = document.createElement("form"); form.onsubmit = e => e.preventDefault();
        const inp = document.createElement("input"); inp.readOnly = true; inp.value = pairUrl; inp.onfocus = () => inp.select();
        const copy = document.createElement("button"); copy.className = "btn"; copy.type = "button"; copy.textContent = "Copy";
        copy.onclick = async () => { try{ await navigator.clipboard.writeText(pairUrl); copy.textContent = "Copied"; }catch{ inp.select(); } };
        form.append(inp, copy);
        if(navigator.share) form.append(link("Share", () => navigator.share({url:pairUrl}).catch(()=>{})));
        const note = document.createElement("p"); note.style.margin = "0";
        note.textContent = "Open this on the other device, or paste it into its sign-in box (that's the way in for a home-screen app). Works once, for an hour.";
        box.append(form, note);
      }
      return;
    }
    if(!signInStep){
      const row = document.createElement("div"); row.className = "row";
      row.append(link("Sync across devices: sign in with email", () => { signInStep = "email"; renderAccount(); $("#acctEmail")?.focus(); }),
                 link("I have a sign-in link", () => { signInStep = "code"; renderAccount(); $("#acctCode")?.focus(); }));
      box.append(row); return;
    }
    const form = document.createElement("form");
    const inp = document.createElement("input");
    const go = document.createElement("button"); go.className = "btn"; go.type = "submit";
    const cancel = link("Cancel", () => { signInStep = null; renderAccount(); });
    if(signInStep==="email"){
      inp.type = "email"; inp.id = "acctEmail"; inp.placeholder = "you@example.com"; inp.autocomplete = "email"; inp.required = true; inp.value = signInEmail;
      go.textContent = "Email me a link";
      form.onsubmit = async e => {
        e.preventDefault(); signInEmail = inp.value.trim(); go.disabled = true; status("Sending…");
        const {error} = await sb.auth.signInWithOtp({email:signInEmail, options:{emailRedirectTo: location.origin + location.pathname}});
        go.disabled = false;
        if(error){
          status(/rate limit/i.test(error.message||"")
            ? "Too many sign-in emails this hour. If another device is already signed in, use “Sign in another device” there instead."
            : (error.message || "Couldn't send the email. Try again."));
          return;
        }
        status(`Sent to ${signInEmail}. Tap the link in the email, or on a home-screen app, long-press it, copy, and paste it here.`);
        signInStep = "code"; renderAccount(); $("#acctCode")?.focus();
      };
    } else {
      inp.id = "acctCode"; inp.autocomplete = "one-time-code"; inp.placeholder = "Paste a sign-in link"; inp.required = true;
      go.textContent = "Sign in";
      form.onsubmit = async e => {
        e.preventDefault(); go.disabled = true; status("Checking…");
        const ok = await verifyPasted(inp.value);
        go.disabled = false;
        if(ok){ signInStep = null; status(""); }
      };
    }
    form.append(inp, go, cancel); box.append(form);
  }

  // Accepts: a link from "Sign in another device" (…#pair=<hash>), the link from the email
  // (…/verify?token=<hash>&type=…, long-pressed and copied so it doesn't open in Safari),
  // a bare token hash, or a 6-digit code.
  async function verifyPasted(raw){
    const v = raw.trim();
    let args = null;
    try{
      const u = new URL(v), pair = new URLSearchParams(u.hash.slice(1)).get("pair");
      const th = pair || u.searchParams.get("token_hash") || u.searchParams.get("token");
      if(th) args = {token_hash:th, type:u.searchParams.get("type")==="signup" ? "signup" : "magiclink"};
    }catch{}
    if(!args && /^[0-9a-f]{32,}$/i.test(v)) args = {token_hash:v, type:"magiclink"};
    if(!args && /^\d{6,8}$/.test(v.replace(/\s/g,"")) && signInEmail) args = {email:signInEmail, token:v.replace(/\s/g,""), type:"email"};
    if(!args){ status("That doesn't look like a sign-in link."); return false; }
    const {data, error} = await sb.auth.verifyOtp(args);
    if(error){ status("That link didn't work. Each one works once and expires after an hour."); return false; }
    await enterSync(data.user); return true;
  }

  let pairUrl = "";
  async function makePairLink(){
    status("Making a link…");
    const {data, error} = await sb.functions.invoke("pair", {method:"POST"});
    if(error || !data?.token_hash){ status("Couldn't make a link. Check you're online and try again."); return; }
    pairUrl = `${location.origin}/#pair=${data.token_hash}`; status(""); renderAccount();
  }

  async function startAuth(){
    if(!window.supabase || SUPABASE_URL.startsWith("__")) return;
    // a "Sign in another device" link opened here
    const pairHash = new URLSearchParams(location.hash.slice(1)).get("pair");
    if(pairHash) history.replaceState(null, "", location.pathname + location.search);
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
    // show cached synced data straight away (works offline) while the session is confirmed
    const cached = lsGet(SYNC, null);
    if(cached?.userId){ mode = "sync"; user = {id:cached.userId}; base = cached.base||empty(); queue = cached.queue||[]; recompute(); render(); }
    sb.auth.onAuthStateChange((ev, session) => {
      if(session?.user && (mode!=="sync" || !user?.email || user.id!==session.user.id)) setTimeout(() => enterSync(session.user), 0);
      if(ev==="SIGNED_OUT" && mode==="sync") leaveSync();
    });
    if(pairHash){
      status("Signing in…");
      if(await verifyPasted(location.origin + "/#pair=" + pairHash)){ status("Signed in on this device."); renderAccount(); return; }
    }
    const {data} = await sb.auth.getSession();
    if(data.session?.user){ await enterSync(data.session.user); }
    else if(cached?.userId && navigator.onLine){ leaveSync(); }
    renderAccount();
  }

  // ---- bubble show ----
  const SPANS = {week:{label:"Week", days:7, phrase:"this week"}, month:{label:"Month", days:30, phrase:"this month"},
                 year:{label:"Year", days:365, phrase:"this year"}, all:{label:"All time", days:null, phrase:null}};
  const show = $("#show"), sky = $("#sky"), ctx = sky.getContext("2d");
  let W=0, H=0, raf=0, bubbles=[], sel="all", example=false, span = lsGet("toy.span", "week");
  if(!SPANS[span]) span = "week";
  let play = null, rec = null;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function size(){
    const dpr = Math.min(devicePixelRatio||1, 2);
    W = show.clientWidth; H = show.clientHeight;
    sky.width = W*dpr; sky.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener("resize", () => { if(!show.hidden && !rec) size(); });

  const hash = str => { let h = 2166136261; for(const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h,16777619); }
    h ^= h>>>16; h = Math.imul(h,0x85ebca6b); h ^= h>>>13; h = Math.imul(h,0xc2b2ae35); h ^= h>>>16; return (h>>>0)/4294967295; };

  function showData(){
    const s = view();
    let friends = Object.entries(s.friends).map(([id,f])=>({id,...f})).sort((a,b)=>(a.order||0)-(b.order||0));
    const end = Date.now(), sp = SPANS[span];
    const from = sp.days ? (span==="week" ? startOfDay(end) - 6*DAY : end - sp.days*DAY) : 0;
    let moments = Object.entries(s.moments).map(([id,m])=>({id,...m})).filter(m=>m.at>=from && m.at<=end);
    if(example){
      const ex0 = sp.days ? from : end - 90*DAY, n = {week:34, month:120, year:400, all:500}[span];
      friends = ["Ana","Tom","Priya","Sam"].map((n,i)=>({id:"ex"+i, name:n, order:i}));
      moments = [];
      for(let k=0;k<n;k++) moments.push({id:"exm"+k, friendId:"ex"+Math.floor(hash("f"+k)*4), at:ex0 + hash("m"+k)*(end-ex0)});
    }
    const hue = {}; friends.forEach((f,i)=>hue[f.id]=HUES[i%HUES.length]);
    const name = Object.fromEntries(friends.map(f=>[f.id,f.name]));
    const img = {};
    friends.forEach(f => { if(f.photo){ const im = new Image(); im.src = f.photo; img[f.id] = im; } });
    moments = moments.filter(m=>name[m.friendId]).sort((a,b)=>a.at-b.at);
    return {friends, moments, hue, name, img, from, end};
  }

  // Replay only the stretch that has moments in it, so a quiet week doesn't mean waiting through empty days.
  function window_(list, d){
    if(!list.length) return {start:d.from || d.end - 7*DAY, end:d.end};
    const first = list[0].at, pad = Math.max(3600e3, (d.end - first)*0.04);
    return {start: Math.max(d.from, first - pad), end: d.end};
  }
  function ticks(start, end){
    const len = end - start, n = 5, out = [];
    const fmt = len <= 2*DAY ? {hour:"numeric"} : len <= 14*DAY ? {weekday:"short"}
      : len <= 120*DAY ? {day:"numeric", month:"short"} : len <= 400*DAY ? {month:"short"} : {month:"short", year:"2-digit"};
    for(let k=0;k<n;k++) out.push(new Date(start + (k/(n-1))*len).toLocaleString(undefined, fmt));
    return out;
  }
  const fmtDay = t => new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
  const fmtClock = (t, len) => new Date(t).toLocaleString(undefined, len <= 14*DAY ? {weekday:"short",hour:"2-digit",minute:"2-digit"} : {day:"numeric",month:"short",year:len>400*DAY?"numeric":undefined});

  function renderChips(d){
    const box = $("#chips"); box.innerHTML = "";
    const mk = (row, on, label, fn) => { const b = document.createElement("button"); b.className="chip"; b.textContent=label;
      b.setAttribute("aria-pressed", on); b.onclick = e => { e.stopPropagation(); fn(); }; row.append(b); };
    const r1 = document.createElement("div"); r1.className = "chiprow";
    for(const [k,v] of Object.entries(SPANS)) mk(r1, span===k, v.label, () => { span = k; lsSet("toy.span", k); openShow(); });
    const r2 = document.createElement("div"); r2.className = "chiprow";
    if(d.friends.length > 1) mk(r2, sel==="all", "Everyone", () => { sel = "all"; openShow(); });
    d.friends.forEach(f => mk(r2, sel===f.id, f.name, () => { sel = f.id; openShow(); }));
    box.append(r1, r2);
  }
  function renderTrack(win){
    const days = $("#days"); days.innerHTML = "";
    ticks(win.start, win.end).forEach(t => { const sp = document.createElement("span"); sp.textContent = t; days.append(sp); });
    const a = fmtDay(win.start), z = fmtDay(win.end);
    $("#showRange").textContent = `${a===z ? a : a+" – "+z}${example?" · example":""}`;
  }

  function spawn(m, d, n){
    const R = Math.random, shrink = n > 250 ? 0.6 : n > 100 ? 0.8 : 1;
    const r = (14 + R()*16 + (sel==="all"?0:4) + (d.img[m.friendId]?8:0)) * shrink;
    bubbles.push({
      x: W*(0.04 + R()*0.66), y: H + r + R()*30, r,
      vy: -(36 + R()*38), vx: 14 + R()*34,
      ph: R()*6.28, hue: d.hue[m.friendId], label: sel==="all" && n <= 60 ? d.name[m.friendId] : "", img: d.img[m.friendId],
      born: performance.now(), out: false, wait: 0
    });
  }

  function drawBubble(b, now){
    const grow = Math.min(1, (now-b.born)/500), r = b.r*(0.3+0.7*grow);
    const g = ctx.createRadialGradient(b.x - r*.3, b.y - r*.3, r*.1, b.x, b.y, r);
    g.addColorStop(0, `hsla(${b.hue},90%,85%,0.04)`);
    g.addColorStop(0.75, `hsla(${b.hue},85%,78%,0.18)`);
    g.addColorStop(1, `hsla(${b.hue},90%,82%,0.55)`);
    if(b.img && b.img.complete && b.img.naturalWidth){
      ctx.save(); ctx.beginPath(); ctx.arc(b.x,b.y,r*.92,0,6.283); ctx.clip();
      ctx.globalAlpha = 0.55; ctx.drawImage(b.img, b.x-r, b.y-r, r*2, r*2); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(b.x,b.y,r,0,6.283); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = `hsla(${(b.hue+40)%360},90%,90%,0.55)`; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(b.x - r*.38, b.y - r*.42, r*.26, r*.13, -0.7, 0, 6.283); ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fill();
    if(b.label && grow===1){
      ctx.font = `500 ${Math.max(10, Math.min(13, r*.55))}px Figtree, system-ui, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "rgba(255,250,240,0.9)";
      ctx.fillText(b.label, b.x, b.y + r + 11);
    }
  }

  // While recording, the DOM overlays are hidden and everything is painted into the canvas instead.
  function wrapLines(text, maxW){
    const words = text.split(" "), lines = []; let line = "";
    for(const w of words){ const t = line ? line+" "+w : w; if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
    if(line) lines.push(line); return lines;
  }
  function paintBackdrop(){
    const g = ctx.createLinearGradient(0,0,0,H);
    [[0,"#1b2140"],[.45,"#2b2d57"],[.8,"#5a4a73"],[1,"#8a6a7c"]].forEach(([o,c]) => g.addColorStop(o,c));
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }
  function paintOverlay(now){
    const pad = 20; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = "#f4efe6";
    ctx.font = `700 ${Math.min(26, W/16)}px "Gowun Batang", Georgia, serif`;
    let y = pad + 26;
    for(const l of wrapLines($("#showTitle").textContent, W - pad*2)){ ctx.fillText(l, pad, y); y += 30; }
    ctx.globalAlpha = .7; ctx.font = `400 13px Figtree, system-ui, sans-serif`; ctx.fillText($("#showRange").textContent, pad, y); ctx.globalAlpha = 1;
    const ty = H - 54, p = play ? Math.min(1, (now - play.t0)/play.dur) : 0;
    ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(pad, ty, W - pad*2, 2);
    ctx.fillStyle = "#f6d38b"; ctx.fillRect(pad, ty, (W - pad*2)*p, 2);
    ctx.fillStyle = "rgba(244,239,230,.6)"; ctx.font = `400 11px Figtree, system-ui, sans-serif`;
    const tk = play ? ticks(play.start, play.end) : [];
    tk.forEach((t,k) => { ctx.textAlign = k===0 ? "left" : k===tk.length-1 ? "right" : "center"; ctx.fillText(t, pad + (k/(tk.length-1))*(W-pad*2), ty + 18); });
    ctx.textAlign = "left"; ctx.fillStyle = "rgba(244,239,230,.8)"; ctx.font = `400 13px Figtree, system-ui, sans-serif`;
    ctx.fillText($("#clock").textContent, pad, H - 16);
    ctx.textAlign = "right"; ctx.fillStyle = "rgba(244,239,230,.45)"; ctx.fillText("thinking-of-you.jall.me", W - pad, H - 16);
    if(play?.done && play.msg){
      const a = Math.min(1, (now - play.doneAt)/1600); ctx.globalAlpha = a; ctx.textAlign = "center"; ctx.fillStyle = "#f4efe6";
      const glow = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*.6);
      glow.addColorStop(0, "rgba(20,20,50,.35)"); glow.addColorStop(1, "rgba(20,20,50,0)");
      ctx.fillStyle = glow; ctx.fillRect(0, H/2 - W*.6, W, W*1.2); ctx.fillStyle = "#f4efe6";
      const fs = Math.max(24, Math.min(38, W/14)); ctx.font = `700 ${fs}px "Gowun Batang", Georgia, serif`;
      const lines = wrapLines(play.msg[0], W - 48); let yy = H/2 - (lines.length*fs*1.25)/2;
      for(const l of lines){ ctx.fillText(l, W/2, yy + fs); yy += fs*1.25; }
      ctx.font = `400 15px Figtree, system-ui, sans-serif`; ctx.globalAlpha = a*.8;
      for(const l of wrapLines(play.msg[1], W - 64)){ ctx.fillText(l, W/2, yy + 26); yy += 21; }
      ctx.globalAlpha = 1;
    }
  }

  let last = 0, D = null;
  function frame(now){
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - (last||now))/1000); last = now;
    const speed = reduced ? 0.5 : 1;
    if(play && !play.done){
      const p = Math.min(1, (now - play.t0)/play.dur), tp = play.start + p*(play.end-play.start);
      while(play.next < play.list.length && play.list[play.next].at <= tp) spawn(play.list[play.next++], D, play.list.length);
      $("#fill").style.width = (p*100)+"%";
      $("#clock").textContent = fmtClock(tp, play.end - play.start);
      if(p>=1){ play.done = true; play.doneAt = now; finale(); }
    }
    if(rec) paintBackdrop(); else ctx.clearRect(0,0,W,H);
    const gust = Math.sin(now/2300)*12 + Math.sin(now/900)*5;
    for(const b of bubbles){
      if(b.out){
        // after the replay, bubbles that drifted off come back round, so what's on screen is always the real moments
        if(!play?.done) continue;
        if(!b.wait){ b.wait = now + Math.random()*5000; continue; }
        if(now < b.wait) continue;
        Object.assign(b, {out:false, wait:0, x: W*(0.04 + Math.random()*0.66), y: H + b.r + Math.random()*30, born: now});
      }
      b.y += b.vy*dt*speed;
      b.x += (b.vx + gust + Math.sin(now/700 + b.ph)*10)*dt*speed;
      if(b.y < -b.r*3 || b.x > W + b.r*3){ b.out = true; continue; }
      drawBubble(b, now);
    }
    if(rec) paintOverlay(now);
  }

  const esc = t => t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function finale(){
    const n = play.list.length, f = $("#finale");
    const who = sel==="all" ? null : D.name[sel];
    if(!n){ f.innerHTML = ""; play.msg = null; return; }
    const times = n===1 ? "once" : `${n.toLocaleString()} times`;
    const when = SPANS[span].phrase || `since ${new Date(play.list[0].at).toLocaleDateString(undefined,{month:"long", year:"numeric"})}`;
    const line = who ? `I thought of you ${times} ${when}, ${who}.` : `I thought of you all ${times} ${when}.`;
    const sub = who ? "Each bubble is a moment you crossed my mind." : "Each bubble is a moment one of you crossed my mind.";
    play.msg = [line, sub];
    f.innerHTML = `${esc(line)}<small>${sub}</small>`;
    f.classList.add("on");
    show.classList.remove("quiet");
    if(rec) setTimeout(stopRecording, 4500);
  }

  function startPlay(){
    D = showData();
    const list = D.moments.filter(m => sel==="all" || m.friendId===sel);
    const win = window_(list, D); renderTrack(win);
    bubbles = []; $("#finale").classList.remove("on");
    const dur = Math.max(10000, Math.min(30000, 8000 + list.length*250));
    play = {t0: performance.now(), dur, list, next:0, start:win.start, end:win.end, done:false, msg:null};
    $("#playBtn").textContent = "Replay";
    show.classList.add("quiet");
  }

  function openShow(){
    D = showData();
    if(sel!=="all" && !D.name[sel]) sel = "all";
    if(sel==="all" && D.friends.length===1) sel = D.friends[0].id;
    renderChips(D);
    const list = D.moments.filter(m => sel==="all" || m.friendId===sel), has = list.length > 0;
    renderTrack(window_(list, D));
    $("#exampleBtn").hidden = has && !example;
    $("#exampleBtn").textContent = example ? "Back to my bubbles" : "Try with example bubbles";
    $("#recBtn").hidden = !has || !canRecord();
    $("#showTitle").textContent = sel==="all" || !D.name[sel] ? "Every time you crossed my mind" : `Every time I thought of ${D.name[sel]}`;
    $("#clock").textContent = has ? "" : `No moments ${SPANS[span].phrase || "yet"}`;
    show.hidden = false; size();
    if(!raf) raf = requestAnimationFrame(frame);
    if(has) startPlay(); else { play = null; bubbles = []; $("#fill").style.width="0"; $("#finale").classList.remove("on"); show.classList.remove("quiet"); }
  }
  function closeShow(){ if(rec) stopRecording(true); show.hidden = true; cancelAnimationFrame(raf); raf = 0; last = 0; play = null; bubbles = []; example = false; }

  // ---- save the replay as a video ----
  // H.264 MP4 first (plays everywhere, incl. iPhone Photos); else WebM. Plain "video/mp4" can mean VP9-in-MP4, which iOS can't play.
  const MIMES = ["video/mp4;codecs=avc1.42E01F", "video/mp4;codecs=avc1.4D401F", "video/mp4;codecs=avc1", "video/webm;codecs=vp9", "video/webm", "video/mp4"];
  const canRecord = () => !!(window.MediaRecorder && sky.captureStream && MIMES.some(m => MediaRecorder.isTypeSupported(m)));
  function startRecording(){
    if(!canRecord()) return;
    const mime = MIMES.find(m => MediaRecorder.isTypeSupported(m));
    const chunks = [], r = new MediaRecorder(sky.captureStream(30), {mimeType:mime, videoBitsPerSecond:6e6});
    r.ondataavailable = e => e.data.size && chunks.push(e.data);
    r.onstop = () => {
      if(r.cancelled) return;
      const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
      const file = new File(chunks, `thinking-of-you-${span}.${ext}`, {type:mime.split(";")[0]});
      if(navigator.canShare?.({files:[file]})) navigator.share({files:[file]}).catch(()=>download(file));
      else download(file);
    };
    rec = r; show.classList.add("recording"); r.start(250); startPlay();
  }
  function download(file){
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  }
  function stopRecording(cancel){
    if(!rec) return; const r = rec; rec = null; r.cancelled = !!cancel;
    show.classList.remove("recording"); try{ r.stop(); }catch{}
  }

  $("#showBtn").onclick = () => { sel = "all"; openShow(); };
  $("#showClose").onclick = e => { e.stopPropagation(); closeShow(); };
  $("#playBtn").onclick = e => { e.stopPropagation(); if(D?.moments.length) startPlay(); };
  $("#recBtn").onclick = e => { e.stopPropagation(); startRecording(); };
  $("#recStop").onclick = e => { e.stopPropagation(); stopRecording(true); };
  $("#exampleBtn").onclick = e => { e.stopPropagation(); example = !example; sel = "all"; openShow(); };
  show.addEventListener("click", () => { if(!rec) show.classList.toggle("quiet"); });
  addEventListener("keydown", e => { if(e.key==="Escape" && !show.hidden) closeShow(); });

  setInterval(render, 60000);
  render();
  renderAccount();
  // quick-log needs the friend list, so wait for sign-in / first pull when synced
  startAuth().catch(()=>{}).finally(quickLog);

  if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body></html>
